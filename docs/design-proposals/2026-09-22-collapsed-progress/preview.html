<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>收起卡进度百分比</title>
<style>
  :root {
    --paper: #faf8f5; --ink: #171923; --muted: #726d67;
    --accent: #b54f2b; --accent-soft: #f6e2d9; --line: #e4ded6;
    --danger: #a3312d; --success: #3e7d44; --success-soft: #e2efe2; --white: #fff;
    --mesh: radial-gradient(ellipse 90% 50% at 100% 0%, #f8efe9 0%, transparent 62%), radial-gradient(ellipse 80% 45% at 0% 100%, #eef2f6 0%, transparent 58%), #fbfaf7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 32px 40px; background: #ece7e1; color: var(--ink); font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
  h1 { margin: 0 0 6px; font-size: 18px; font-weight: 650; }
  .lead { margin: 0 0 22px; max-width: 760px; color: #4e4944; font-size: 13px; line-height: 1.55; }
  .board { display: grid; grid-template-columns: 440px 440px; gap: 22px 28px; align-items: start; }
  figure { margin: 0; }
  figcaption { margin: 0 0 8px; font-size: 12px; font-weight: 650; color: #3d3834; }
  figcaption small { display: block; margin-top: 2px; font-weight: 450; color: var(--muted); }
  .win { width: 440px; height: 176px; border: 1px solid var(--line); border-radius: 18px; background: var(--mesh); overflow: hidden; box-shadow: 0 10px 28px #17192314; }
  .win.narrow { width: 340px; }
  .titlebar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; }
  .logo { width: 40px; height: 40px; flex: 0 0 auto; }
  .app-title { flex: 1; font-size: 16px; font-weight: 600; }
  .actions { display: flex; gap: 1px; color: #5c564f; }
  .actions i { width: 30px; height: 30px; display: grid; place-items: center; }
  .content { height: 124px; padding: 9px 12px 11px; }
  .home { height: 104px; display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; }
  .with-insight { height: 104px; display: grid; grid-template-rows: 22px 77px; gap: 5px; }
  .with-insight .home { height: 77px; }
  .insight { height: 22px; display: flex; align-items: center; gap: 5px; padding: 0 6px; border-radius: 7px; background: #f8f4ef; }
  .insight span { color: var(--accent); font-size: 9px; font-weight: 700; }
  .insight b { font-size: 10px; font-weight: 650; }
  .insight em { margin-left: auto; color: var(--accent); font-size: 9px; font-style: normal; font-weight: 650; }
  .stack { position: relative; height: 104px; }
  .with-insight .stack { height: 77px; }
  .sheet { position: absolute; left: 8px; right: 8px; top: 14px; height: 90px; border: 1px solid var(--line); border-radius: 14px; background: #f3efea; }
  .with-insight .sheet { top: 11px; height: 66px; }
  .card { position: absolute; z-index: 1; left: 0; right: 0; top: 0; height: 92px; display: flex; flex-direction: column; padding: 26px 10px 8px; border: 1px solid #e1dad1; border-radius: 14px; background: #fff; box-shadow: 0 5px 14px #4c40310b; }
  .with-insight .card { height: 70px; padding: 20px 9px 5px; }
  .badges { position: absolute; top: 8px; left: 10px; display: flex; gap: 4px; }
  .with-insight .badges { top: 4px; left: 9px; }
  .pill { font-size: 9.5px; font-weight: 650; line-height: 1; padding: 3px 8px; border-radius: 999px; }
  .with-insight .pill { font-size: 9px; padding: 2px 7px; }
  .pill.todo { background: var(--success-soft); color: var(--success); }
  .pill.over { background: #f9e9e7; color: var(--danger); }
  .time { position: absolute; top: 10px; right: 10px; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .time b { margin-right: 3px; }
  .time.over { color: var(--danger); font-weight: 600; }
  .with-insight .time { top: 6px; right: 9px; font-size: 9px; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 9px; align-items: center; }
  .with-insight .main { gap: 7px; }
  .check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid #b7b0a6; }
  .with-insight .check { width: 18px; height: 18px; }
  .check.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); color: #fff; display: grid; place-items: center; font-size: 11px; }
  .title { font-size: 14px; font-weight: 650; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .with-insight .title { font-size: 12px; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; min-height: 15px; }
  .with-insight .meta { margin-top: 3px; min-height: 13px; }
  .meta-id { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .cat { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; color: var(--muted); font-size: 10px; white-space: nowrap; }
  .with-insight .cat, .with-insight .pct { font-size: 9px; }
  .cat i { width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: #b8532f; }
  .cat span { overflow: hidden; text-overflow: ellipsis; }
  .pct { flex: 0 0 auto; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .pager { margin-left: auto; display: flex; align-items: center; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pager svg { width: 14px; height: 14px; }
  .pager .up { transform: rotate(180deg); }
  .confirm { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .ok { min-height: 20px; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10.5px; font-weight: 650; }
  .no { min-height: 20px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--muted); font-size: 10.5px; }
  .side { height: 104px; display: grid; grid-template-rows: 1fr 1fr; gap: 6px; }
  .with-insight .side { height: 77px; gap: 5px; }
  .side button { display: flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid #e4ded6; border-radius: 12px; background: #fff; font-size: 11px; color: var(--ink); }
  .narrow .side button { gap: 5px; padding: 0 7px; font-size: 10px; }
  .side svg { color: #a66c50; flex: 0 0 auto; }
</style>
</head>
<body>
  <h1>收起卡 · 进度百分比</h1>
  <p class="lead">没开「维护进度」时底行和现在一样。开了之后，百分数跟在分类后面，包括 0%。它不做成胶囊，也不挤进右上角的时间。翻页器仍靠右；点了圆框之后，百分数留在分类旁，确认条占右侧。</p>
  <div class="board">
    <figure>
      <figcaption>现在<small>没开维护进度，底行只有分类和翻页</small></figcaption>
      <div class="win" id="now"></div>
    </figure>
    <figure>
      <figcaption>开了，进度是 0<small>写出 0%，不当成没填</small></figcaption>
      <div class="win" data-pct="0%" data-title="整理收件箱"></div>
    </figure>
    <figure>
      <figcaption>开了，进度是 40<small>和展开列表同一个数字</small></figcaption>
      <div class="win" data-pct="40%" data-title="完成项目报告" data-page="2 / 3"></div>
    </figure>
    <figure>
      <figcaption>已超期<small>时间变红，百分数仍在分类后面</small></figcaption>
      <div class="win" data-pct="100%" data-title="补交季度材料" data-over="1" data-time="完成时间 9/18 18:00"></div>
    </figure>
    <figure>
      <figcaption>待确认<small>再点圆框是取消；百分数还在</small></figcaption>
      <div class="win" data-pct="40%" data-title="完成项目报告" data-armed="1"></div>
    </figure>
    <figure>
      <figcaption>窄版，标签很长<small>340px。百分数不缩，分类省略</small></figcaption>
      <div class="win narrow" data-pct="100%" data-title="整理本周纪要" data-cat="客户成功、续约与季度复盘跟进" data-insight="1" data-page="1 / 4"></div>
    </figure>
  </div>
  <template id="win">
    <div class="titlebar">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="11" fill="none" stroke="#171923" stroke-width="2.2"/><circle cx="29.2" cy="13.2" r="3.1" fill="#a3312d"/></svg>
      <div class="app-title">To Do List</div>
      <div class="actions" aria-hidden="true"><i><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2.2v7.2M5.2 6.6 8 9.4l2.8-2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></i><i><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></i></div>
    </div>
    <div class="content">
      <div class="frame">
        <div class="home">
          <div class="stack">
            <div class="sheet"></div>
            <article class="card">
              <div class="badges"><span class="pill todo">待办</span></div>
              <div class="time"><b>完成时间</b>9/22 23:59</div>
              <div class="main"><span class="check"></span><div class="title">完成项目报告</div></div>
              <div class="meta">
                <span class="meta-id"><span class="cat"><i></i><span>工作</span></span></span>
                <div class="pager"><span class="n">1 / 2</span><svg class="up" width="9" height="9" viewBox="0 0 9 9"><path d="M1.5 3.4 4.5 6.2 7.5 3.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg width="9" height="9" viewBox="0 0 9 9"><path d="M1.5 3.4 4.5 6.2 7.5 3.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
              </div>
            </article>
          </div>
          <nav class="side">
            <button type="button"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>新增事项</span></button>
            <button type="button"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2.2 9.1 6h3.8L10.2 8.3l1.1 3.7L8 9.8 4.7 12l1.1-3.7L3.1 6h3.8z" fill="currentColor"/></svg><span>AI 助手</span></button>
          </nav>
        </div>
      </div>
    </div>
  </template>
  <script>
    const tpl = document.getElementById('win');
    for (const host of document.querySelectorAll('.win')) {
      host.append(tpl.content.cloneNode(true));
      const card = host.querySelector('.card');
      if (host.dataset.title) card.querySelector('.title').textContent = host.dataset.title;
      if (host.dataset.cat) card.querySelector('.cat span').textContent = host.dataset.cat;
      if (host.dataset.time) {
        const time = card.querySelector('.time');
        const label = '完成时间';
        time.replaceChildren(Object.assign(document.createElement('b'), { textContent: label }), ' ' + host.dataset.time.slice(label.length).trim());
      }
      if (host.dataset.over) {
        card.querySelector('.badges').insertAdjacentHTML('beforeend', '<span class="pill over">已超期</span>');
        card.querySelector('.time').classList.add('over');
      }
      if (host.dataset.page) card.querySelector('.n').textContent = host.dataset.page;
      if (host.dataset.pct) {
        const pct = document.createElement('span');
        pct.className = 'pct';
        pct.textContent = host.dataset.pct;
        card.querySelector('.meta-id').append(pct);
      }
      if (host.dataset.armed) {
        card.querySelector('.check').classList.add('on');
        card.querySelector('.check').textContent = '✓';
        card.querySelector('.pager').outerHTML = '<div class="confirm"><span class="ok">确认完成</span><span class="no">取消</span></div>';
      }
      if (host.dataset.insight) {
        const frame = host.querySelector('.frame');
        frame.classList.add('with-insight');
        frame.insertAdjacentHTML('afterbegin', '<div class="insight"><span>AI 建议</span><b>先完成报告再整理收件箱</b><em>查看</em></div>');
      }
    }
  </script>
</body>
</html>
