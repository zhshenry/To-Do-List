<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 助手气泡</title>
<style>
  :root {
    color-scheme: light;
    --ink: #171923; --muted: #726d67; --accent: #b54f2b; --accent-soft: #f6e2d9;
    --line: #e4ded6; --subtle: #efebe6; --white: #ffffff; --titlebar: #f2eee8; --paper: #faf8f5;
    --font: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    --mesh: radial-gradient(ellipse 90% 50% at 100% 0%, #f8efe9 0%, transparent 62%), radial-gradient(ellipse 70% 40% at 0% 100%, #eef2f6 0%, transparent 58%), #fbfaf7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e4ddd4; color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; }
  .sheet { padding: 32px 40px 44px; }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.03em; }
  .lead { max-width: 640px; margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .ph { display: block; }

  .scene { position: relative; width: 480px; height: 500px; margin-top: 22px; }
  .main {
    position: absolute; right: 0; bottom: 0; width: 340px; height: 430px;
    border: 1px solid var(--line); border-radius: 18px; background: var(--mesh); overflow: hidden;
    box-shadow: 0 16px 36px #4c403012;
  }
  .main-bar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; }
  .logo { width: 28px; height: 28px; border: 3px solid #221f1c; border-radius: 50%; position: relative; }
  .logo::after { content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: #c45a32; }
  .main-bar b { font-size: 14px; font-weight: 600; }
  .main-date { margin: 2px 17px 0; font-size: 24px; font-weight: 700; letter-spacing: -1px; }
  .card { margin: 14px 17px 0; padding: 12px; background: var(--white); border: 1px solid var(--line); border-radius: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; }
  .row { display: grid; grid-template-columns: 22px 1fr; gap: 3px 10px; padding: 8px 2px; }
  .check { width: 22px; height: 22px; grid-row: 1 / span 2; border: 1.5px solid #b7b0a6; border-radius: 50%; }
  .row b { font-size: 14px; font-weight: 600; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .meta i { width: 7px; height: 7px; border-radius: 50%; background: #c45c26; display: inline-block; margin-right: 5px; }
  .star {
    position: absolute; right: 12px; bottom: 12px; z-index: 3;
    width: 44px; height: 44px; display: grid; place-items: center;
    border: 1px solid var(--accent-soft); border-radius: 12px; background: var(--accent-soft); color: var(--accent);
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent-soft) 55%, transparent);
  }
  .star .ph { width: 22px; height: 22px; }

  .bubble {
    position: absolute; right: 62px; bottom: 74px; z-index: 2;
    width: 332px; display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 22px; background: #fbfaf7;
    box-shadow: 0 16px 36px #1719231c;
  }
  .tail { position: absolute; right: 10px; bottom: -13px; width: 42px; height: 18px; }
  .head { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 10px 4px 12px; }
  .avatar { position: relative; width: 34px; height: 34px; flex-shrink: 0; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
  .avatar .ph { width: 16px; height: 16px; }
  .dot { position: absolute; right: 0; bottom: 0; width: 8px; height: 8px; border: 2px solid #fbfaf7; border-radius: 50%; background: #3d9a62; }
  .who { display: flex; flex-direction: column; line-height: 1.15; flex-shrink: 0; }
  .who b { font-size: 14px; font-weight: 650; }
  .who small { color: var(--muted); font-size: 10.5px; }
  .session { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
  .session span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .ph { width: 11px; height: 11px; color: var(--muted); flex-shrink: 0; }
  .new-chat { flex-shrink: 0; min-height: 30px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--white) 88%, var(--paper)); color: var(--muted); font-size: 12px; font-weight: 600; }
  .x { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink); }
  .x .ph { width: 14px; height: 14px; }
  .thread { padding: 6px 14px 8px; display: flex; flex-direction: column; gap: 8px; }
  .user { align-self: flex-end; max-width: 84%; padding: 10px 12px; border-radius: 15px 15px 5px 15px; background: color-mix(in srgb, var(--titlebar) 74%, var(--white)); font-size: 13px; line-height: 1.65; }
  .ai { align-self: flex-start; max-width: 88%; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--muted) 17%, var(--line)); border-radius: 15px 15px 15px 5px; background: color-mix(in srgb, var(--white) 90%, transparent); font-size: 13px; line-height: 1.65; }
  .foot { padding: 0 12px 14px; }
  .compose { display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 8px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--white); }
  .placeholder { color: var(--muted); font-size: 13px; }
  .meta { display: flex; align-items: center; justify-content: space-between; }
  .model { height: 28px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border: 1px solid var(--line); border-radius: 9px; background: #f7f1ea; font-size: 10px; }
  .model .ph { width: 10px; height: 10px; color: var(--muted); }
  .send { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
  .send .ph { width: 15px; height: 15px; }
  .note { margin: 14px 0 0; max-width: 520px; color: var(--muted); font-size: 12px; line-height: 1.65; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-spark" viewBox="0 0 256 256"><path fill="currentColor" d="M208,144a15.78,15.78,0,0,1-10.42,14.94L146,178l-19,51.62a15.92,15.92,0,0,1-29.88,0L78,178l-51.62-19a15.92,15.92,0,0,1,0-29.88L78,110l19-51.62a15.92,15.92,0,0,1,29.88,0L146,110l51.62,19A15.78,15.78,0,0,1,208,144ZM152,48h16V64a8,8,0,0,0,16,0V48h16a8,8,0,0,0,0-16H184V16a8,8,0,0,0-16,0V32H152a8,8,0,0,0,0,16Zm88,32h-8V72a8,8,0,0,0-16,0v8h-8a8,8,0,0,0,0,16h8v8a8,8,0,0,0,16,0V96h8a8,8,0,0,0,0-16Z"/></symbol>
  <symbol id="i-caret" viewBox="0 0 256 256"><path fill="currentColor" d="M216.49,104.49l-80,80a12,12,0,0,1-17,0l-80-80a12,12,0,0,1,17-17L128,159l71.51-71.52a12,12,0,0,1,17,17Z"/></symbol>
  <symbol id="i-x" viewBox="0 0 256 256"><path fill="currentColor" d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></symbol>
  <symbol id="i-plane" viewBox="0 0 256 256"><path fill="currentColor" d="M231.4,44.34s0,.1,0,.15l-58.2,191.94a15.88,15.88,0,0,1-14,11.51q-.69.06-1.38.06a15.86,15.86,0,0,1-14.42-9.15L107,164.15a4,4,0,0,1,.77-4.58l57.92-57.92a8,8,0,0,0-11.31-11.31L96.43,148.26a4,4,0,0,1-4.58.77L17.08,112.64a16,16,0,0,1,2.49-29.8l191.94-58.2.15,0A16,16,0,0,1,231.4,44.34Z"/></symbol>
</svg>
<div class="sheet">
  <h1>贴着星形按钮的短气泡</h1>
  <p class="lead">话少的时候，窗口只包住标题、这几句和输入框。对话从输入框往上排，右下角的尾巴和纸面是同一条边，尖端离星形按钮大约 8px。对话变长就往上长，最高仍是 620。你手动拖过的大小保持不动。</p>
  <div class="scene">
    <div class="main" aria-hidden="true">
      <div class="main-bar"><i class="logo"></i><b>To Do List</b></div>
      <div class="main-date">9月22日</div>
      <section class="card">
        <h2>待办</h2>
        <div class="row">
          <i class="check"></i>
          <b>完成 DAMA BOOK 学习</b>
          <span class="meta"><span><i></i>学习</span><span>完成时间 9/30 23:59</span></span>
        </div>
      </section>
      <span class="star"><svg class="ph"><use href="#i-spark"/></svg></span>
    </div>
    <section class="bubble" aria-label="AI 助手">
      <svg class="tail" viewBox="0 0 42 18" aria-hidden="true">
        <path d="M1 1.2 C14 1.2, 24 6, 40 16.8 C26 12.2, 14 9.5, 1 6.2 Z" fill="#fbfaf7" stroke="#e4ded6" stroke-linejoin="round"/>
        <path d="M2 1.2 H16" stroke="#fbfaf7" stroke-width="3"/>
      </svg>
      <header class="head">
        <span class="avatar"><svg class="ph"><use href="#i-spark"/></svg><i class="dot"></i></span>
        <span class="who"><b>AI 助手</b><small>可用</small></span>
        <span class="session"><span>问数模板库</span><svg class="ph"><use href="#i-caret"/></svg></span>
        <span class="new-chat">新对话</span>
        <span class="x"><svg class="ph"><use href="#i-x"/></svg></span>
      </header>
      <div class="thread">
        <div class="user">我明天下班前要把问数模板库的功能做完</div>
        <div class="ai">已生成一条修改建议。预览确认后才会写入。</div>
      </div>
      <footer class="foot">
        <div class="compose">
          <div class="placeholder">Enter 发送 · Shift + Enter 换行</div>
          <div class="meta">
            <span class="model">deepseek-v4-flash <svg class="ph"><use href="#i-caret"/></svg></span>
            <span class="send"><svg class="ph"><use href="#i-plane"/></svg></span>
          </div>
        </div>
      </footer>
    </section>
  </div>
  <p class="note">屏幕放不下、气泡改到按钮另一侧时，尾巴跟着换边，还是指向这颗星。</p>
</div>
</body>
</html>
