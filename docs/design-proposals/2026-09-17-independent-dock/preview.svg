<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650"><rect width="1120" height="650" fill="#faf8f5"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif" fill="#171923"><text x="42" y="56" font-size="28" font-weight="600">悬浮图标 · 四款初稿</text><text x="42" y="88" font-size="15" fill="#726d67">同一款桌面入口，不同外观。上方放大展示，下方按 72px 对比。</text><path d="M42 110h1036" stroke="#e4ded6"/><rect x="42" y="365" width="1036" height="111" rx="16" fill="#eeeae3"/><rect x="42" y="500" width="1036" height="111" rx="16" fill="#29302d"/><text x="60" y="388" font-size="12" fill="#726d67">浅色桌面</text><text x="60" y="523" font-size="12" fill="#d8dfd9">深色桌面</text><g><text x="170" y="141" text-anchor="middle" font-size="22" font-weight="600">圆环</text><image href="data:image/svg+xml;base64," x="106" y="169" width="128" height="128"/><text x="170" y="329" text-anchor="middle" font-size="15" fill="#726d67">保留品牌 · 建议默认</text><image href="data:image/svg+xml;base64," x="134" y="385" width="72" height="72"/><image href="data:image/svg+xml;base64," x="134" y="520" width="72" height="72"/></g><g><text x="430" y="141" text-anchor="middle" font-size="22" font-weight="600">小笺</text><image href="data:image/svg+xml;base64," x="366" y="169" width="128" height="128"/><text x="430" y="329" text-anchor="middle" font-size="15" fill="#726d67">待办直觉 · 清晰克制</text><image href="data:image/svg+xml;base64," x="394" y="385" width="72" height="72"/><image href="data:image/svg+xml;base64," x="394" y="520" width="72" height="72"/></g><g><text x="690" y="141" text-anchor="middle" font-size="22" font-weight="600">嫩芽</text><image href="data:image/svg+xml;base64," x="626" y="169" width="128" height="128"/><text x="690" y="329" text-anchor="middle" font-size="15" fill="#726d67">柔和绿色 · 安静陪伴</text><image href="data:image/svg+xml;base64," x="654" y="385" width="72" height="72"/><image href="data:image/svg+xml;base64," x="654" y="520" width="72" height="72"/></g><g><text x="950" y="141" text-anchor="middle" font-size="22" font-weight="600">团猫</text><image href="data:image/svg+xml;base64," x="886" y="169" width="128" height="128"/><text x="950" y="329" text-anchor="middle" font-size="15" fill="#726d67">轻松可爱 · 静态伙伴</text><image href="data:image/svg+xml;base64," x="914" y="385" width="72" height="72"/><image href="data:image/svg+xml;base64," x="914" y="520" width="72" height="72"/></g><text x="42" y="637" font-size="12" fill="#726d67">设计预览 · 未接入应用 · 圆环沿用现有 BrandMark，其余为新增 SVG 图标</text></g></svg>